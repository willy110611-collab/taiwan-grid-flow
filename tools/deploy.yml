# 台灣光脈搏 — GitHub Pages 自動部署
# 1. 每次 push（一鍵更新.bat）→ 重新建置並上線
# 2. 每 10 分鐘自動抓一次台電資料 → 放到 ./data/genary.json（同網域，手機版不受 CORS 限制）
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 抓取台電各機組發電量
        continue-on-error: true
        run: |
          mkdir -p public/data
          for f in genary.json genary.txt; do
            if curl -fsSL --max-time 25 \
                 -A "Mozilla/5.0 (TaiwanGridFlow; GitHub Actions)" \
                 -e "https://www.taipower.com.tw/d006/loadGraph/loadGraph/genshx_.html" \
                 "https://www.taipower.com.tw/d006/loadGraph/loadGraph/data/$f" -o public/data/genary.json \
               && node -e "const j=JSON.parse(require('fs').readFileSync('public/data/genary.json','utf8').replace(/^﻿/,''));if(!Array.isArray(j.aaData)||j.aaData.length<5)process.exit(1)"; then
              echo "取得 $f"; exit 0
            fi
          done
          echo "台電資料取得失敗，網頁會自動改用模擬資料"; rm -f public/data/genary.json

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
