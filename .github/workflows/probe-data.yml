# 一次性：抓 OSM 台灣發電廠位置（核對 geo.js 座標用），提交回這個分支（之後刪除）
name: Probe data
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-data.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSM power=plant
        run: |
          Q='[out:json][timeout:200][bbox:21.8,118.1,26.4,122.1];(nwr["power"="plant"];);out center tags;'
          UA="taiwan-grid-flow/1.0 (https://github.com/willy110611-collab/taiwan-grid-flow)"
          mkdir -p probe
          for host in https://overpass-api.de https://overpass.private.coffee https://maps.mail.ru/osm/tools/overpass; do
            if curl -fsS --max-time 220 -A "$UA" -H "Accept: application/json" -X POST --data-urlencode "data=$Q" "$host/api/interpreter" -o /tmp/p.json; then echo "ok $host"; break; fi
            sleep 5
          done
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/p.json", "utf8"));
            const out = d.elements.map((e) => { const t = e.tags || {}; const c = e.center || { lat: e.lat, lon: e.lon };
              return { name: t.name || "", en: t["name:en"] || "", src: t["plant:source"] || "", mw: t["plant:output:electricity"] || "", op: t.operator || "", pos: [Math.round(c.lon * 1e4) / 1e4, Math.round(c.lat * 1e4) / 1e4] }; });
            require("fs").writeFileSync("probe/osm-plants.json", JSON.stringify({ fetched: d.osm3s?.timestamp_osm_base, plants: out }));
            console.log("plants", out.length);
          '
      - name: 提交回分支
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add probe && git commit -m "暫時：OSM 發電廠位置（核對用）" && git push
