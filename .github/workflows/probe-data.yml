# 一次性（第 3 輪）：找臺南／臺北／桃園自來水管線開放資料的下載網址與樣本、台水停水地圖的資料來源與使用規定（之後刪除）
name: Probe data
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-data.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓資料
        run: |
          set +e
          mkdir -p probe
          UA="Mozilla/5.0 (taiwan-grid-flow; https://github.com/willy110611-collab/taiwan-grid-flow)"
          get() { code=$(curl -sSL -A "$UA" --max-time 120 -o "probe/$1" -w '%{http_code} %{size_download} %{content_type}' "$2"); echo "$1 $code $2" >> probe/summary.txt; }
          curl -sSL -A "$UA" --max-time 120 "https://data.taipei/api/dataset/af167303-0e5f-45dd-b624-a01f541565ce/resource/30056122-21c3-4a6d-9f90-274509a08e7a/download" | head -c 40000 > probe/taipei-pipe-head.xml
          echo "taipei head $(stat -c %s probe/taipei-pipe-head.xml)" >> probe/summary.txt
          curl -sSL -A "$UA" --max-time 60 -o probe/tainan-gis.json -w 'tainan %{http_code} %{size_download}\n' "https://soa.tainan.gov.tw/Api/Service/GetGis/32b5cb9a-2939-4655-b2cc-8031dd20f01e" >> probe/summary.txt
          ls -la probe; for f in probe/*; do s=$(stat -c %s "$f"); [ "$s" -gt 4000000 ] && head -c 4000000 "$f" > "$f.p" && mv "$f.p" "$f" && echo "$f truncated from $s" >> probe/summary.txt; done
          cat probe/summary.txt
      - name: 提交回分支
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add probe && git commit -m "暫時：管線與停水資料來源樣本" && git push
