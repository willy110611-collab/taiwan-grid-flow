# 一次性：抓 Ember 年度電力資料（CC BY 4.0），只留需要的國家與欄位，提交回這個分支（評估用，之後刪除）
name: Probe data
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-data.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ember yearly
        run: |
          mkdir -p probe
          for u in \
            https://storage.googleapis.com/emb-prod-bkt-publicdata/public-downloads/yearly_full_release_long_format.csv \
            https://ember-energy.org/app/uploads/2024/05/yearly_full_release_long_format.csv ; do
            echo "== $u"
            if curl -fsSL --max-time 300 -A "taiwan-grid-flow/1.0" -o /tmp/ember.csv "$u"; then ls -la /tmp/ember.csv; head -c 600 /tmp/ember.csv; echo; break; fi
          done
          node -e '
            const fs = require("fs");
            const t = fs.readFileSync("/tmp/ember.csv", "utf8").split(/\r?\n/);
            const head = t[0].split(",");
            console.log(head.join("|"));
            const want = new Set(["Taiwan","Japan","South Korea","China","United States of America","Germany","France","United Kingdom","World","Singapore","Australia","India","Viet Nam","Philippines"]);
            const keep = [t[0]];
            for (const line of t.slice(1)) { const area = line.split(",")[0].replace(/"/g, ""); if (want.has(area)) keep.push(line); }
            fs.writeFileSync("probe/ember-sel.csv", keep.join("\n"));
            console.log("rows", keep.length);
          '
          ls -la probe
      - name: 提交回分支
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add probe && git commit -m "暫時：Ember 年度資料（評估用）" && git push
