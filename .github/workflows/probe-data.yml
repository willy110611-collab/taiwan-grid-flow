# 一次性：抓自來水預覽圖用的完整樣本（淨水場、水庫、臺南給水管線），提交回這個分支（之後刪除）
name: Probe data
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-data.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓資料
        run: |
          set +e
          mkdir -p probe
          UA="taiwan-grid-flow/1.0 (https://github.com/willy110611-collab/taiwan-grid-flow)"
          get() { code=$(curl -sSL -A "$UA" --max-time 90 -o "probe/$1" -w '%{http_code} %{size_download}' "$2"); echo "$1 $code $2" >> probe/summary.txt; }
          get supp7.csv "https://www.water.gov.tw/opendata/supp7.csv"
          get dgt-45501.json "https://data.gov.tw/api/v2/rest/dataset/45501"
          get dgt-122507.json "https://data.gov.tw/api/v2/rest/dataset/122507"
          get dgt-36695.json "https://data.gov.tw/api/v2/rest/dataset/36695"
          for u in $(python3 -c "import json;d=json.load(open('probe/dgt-45501.json'))['result'];print(' '.join(r['resourceDownloadUrl'].replace(' ','%20') for r in d.get('distribution',[]) if 'JSON' in r.get('resourceFormat','').upper() or 'json' in r.get('resourceDownloadUrl','').lower())[:1] if False else ' '.join([r['resourceDownloadUrl'].replace(' ','%20') for r in d.get('distribution',[])][:3]))"); do
            n=$((n+1)); get "res45501-$n" "$u"
          done
          for u in $(python3 -c "import json;d=json.load(open('probe/dgt-122507.json'))['result'];print(' '.join([r['resourceDownloadUrl'].replace(' ','%20') for r in d.get('distribution',[])][:2]))"); do
            m=$((m+1)); get "res122507-$m" "$u"
          done
          get drought.json "https://opendata.wra.gov.tw/api/v2/51ea7202-18fd-46e3-adae-4d05bc827a28?sort=_importdate%20asc&format=JSON"
          ls -la probe
          # 太大的檔案只留前 3 MB（預覽用）
          for f in probe/*; do s=$(stat -c %s "$f"); [ "$s" -gt 3000000 ] && head -c 3000000 "$f" > "$f.part" && mv "$f.part" "$f" && echo "$f truncated from $s" >> probe/summary.txt; done
          cat probe/summary.txt
      - name: 提交回分支
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add probe && git commit -m "暫時：自來水預覽用樣本" && git push
