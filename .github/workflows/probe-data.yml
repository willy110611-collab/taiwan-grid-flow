# 一次性：實測澳洲（AEMO）、英國（Elexon）即時電力資料能否取得（評估「其他國家」用），提交回這個分支（之後刪除）
name: Probe data
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-data.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓樣本
        run: |
          mkdir -p probe
          UA="taiwan-grid-flow/1.0 (https://github.com/willy110611-collab/taiwan-grid-flow)"
          probe() { # 名稱 網址
            code=$(curl -sS -A "$UA" -H "Origin: https://willy110611-collab.github.io" --max-time 60 -D probe/$1.h -o probe/$1.body -w '%{http_code} %{size_download} %{time_total}' "$2" || echo "fail")
            echo "$1 $code $2" >> probe/summary.txt
            head -c 6000 probe/$1.body > probe/$1.txt; rm -f probe/$1.body
          }
          probe aemo-scada-list "https://nemweb.com.au/Reports/Current/Dispatch_SCADA/"
          probe aemo-summary "https://visualisations.aemo.com.au/aemo/apps/api/report/ELEC_NEM_SUMMARY"
          probe aemo-dispatchis-list "https://nemweb.com.au/Reports/Current/DispatchIS_Reports/"
          F=$(grep -o 'PUBLIC_DISPATCHSCADA_[0-9_]*\.zip' probe/aemo-scada-list.txt | tail -1)
          [ -z "$F" ] && F=$(curl -sS -A "$UA" https://nemweb.com.au/Reports/Current/Dispatch_SCADA/ | grep -o 'PUBLIC_DISPATCHSCADA_[0-9_]*\.zip' | tail -1)
          echo "latest scada $F" >> probe/summary.txt
          if [ -n "$F" ]; then curl -sS -A "$UA" -o /tmp/s.zip "https://nemweb.com.au/Reports/Current/Dispatch_SCADA/$F" && ls -l /tmp/s.zip >> probe/summary.txt && unzip -p /tmp/s.zip | head -40 > probe/aemo-scada-sample.csv && unzip -p /tmp/s.zip | wc -l >> probe/summary.txt; fi
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ); AGO=$(date -u -d '-40 min' +%Y-%m-%dT%H:%M:%SZ)
          probe elexon-fuelinst "https://data.elexon.co.uk/bmrs/api/v1/datasets/FUELINST?publishDateTimeFrom=$AGO&publishDateTimeTo=$NOW&format=json"
          probe elexon-pn "https://data.elexon.co.uk/bmrs/api/v1/datasets/PN/stream?from=$AGO&to=$NOW"
          probe elexon-b1610 "https://data.elexon.co.uk/bmrs/api/v1/datasets/B1610/stream?from=$(date -u -d '-7 day' +%Y-%m-%dT%H:%M:%SZ)&to=$(date -u -d '-7 day +30 min' +%Y-%m-%dT%H:%M:%SZ)"
          probe elexon-bmunits "https://data.elexon.co.uk/bmrs/api/v1/reference/bmunits/all"
          probe uk-carbon "https://api.carbonintensity.org.uk/generation"
          probe uk-regional "https://api.carbonintensity.org.uk/regional"
          probe rte-eco2mix "https://odre.opendatasoft.com/api/explore/v2.1/catalog/datasets/eco2mix-national-tr/records?limit=2&order_by=date_heure%20desc"
          cat probe/summary.txt
      - name: 提交回分支
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add probe && git commit -m "暫時：澳洲／英國電力資料實測樣本（評估用）" && git push
