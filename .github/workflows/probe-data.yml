# 一次性：抓 OSM 超高壓線路，精簡後提交回這個分支（預覽用，之後刪除）
name: Probe data
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-data.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSM 輸電線（Overpass，台灣範圍）
        run: |
          Q='[out:json][timeout:300][bbox:21.8,119.9,25.4,122.1];(way["power"="line"]["voltage"~"345000"];way["power"="line"]["voltage"~"161000"];node["power"="substation"]["voltage"~"345000"];way["power"="substation"]["voltage"~"345000"];);out geom;'
          UA="taiwan-grid-flow/1.0 (https://github.com/willy110611-collab/taiwan-grid-flow)"
          for host in https://overpass-api.de https://overpass.private.coffee https://maps.mail.ru/osm/tools/overpass; do
            if curl -fsS --max-time 320 -A "$UA" -H "Accept: application/json" -X POST --data-urlencode "data=$Q" "$host/api/interpreter" -o /tmp/osm.json; then echo "ok $host"; break; fi
            sleep 5
          done
          mkdir -p probe
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/osm.json", "utf8"));
            const r = (v) => Math.round(v * 1e4) / 1e4;
            const lines = [], subs = [];
            for (const e of d.elements) {
              const t = e.tags || {};
              if (e.type === "way" && t.power === "line") lines.push({ kv: /345000/.test(t.voltage) ? 345 : 161, name: t.name || "", c: e.geometry.map((p) => [r(p.lon), r(p.lat)]) });
              if (t.power === "substation") { const g = e.geometry ? e.geometry : [{ lat: e.lat, lon: e.lon }]; const lat = g.reduce((a, p) => a + p.lat, 0) / g.length, lon = g.reduce((a, p) => a + p.lon, 0) / g.length; subs.push({ name: t.name || "", pos: [r(lon), r(lat)] }); }
            }
            require("fs").writeFileSync("probe/osm-lines.json", JSON.stringify({ source: "OpenStreetMap contributors (ODbL)", fetched: d.osm3s?.timestamp_osm_base, lines, subs }));
            console.log("lines", lines.length, "subs", subs.length);
          '
          ls -la probe
      - name: 提交回分支
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add probe && git commit -m "暫時：OSM 輸電線資料（預覽用）" && git push
