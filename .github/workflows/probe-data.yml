# 一次性：評估「台灣自來水版」可用的政府開放資料（水利署、台水、北水）與 OSM 水務設施數量，提交回這個分支（之後刪除）
name: Probe data
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-data.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓樣本
        run: |
          mkdir -p probe
          UA="taiwan-grid-flow/1.0 (https://github.com/willy110611-collab/taiwan-grid-flow)"
          probe() { # 名稱 網址
            code=$(curl -sSL -A "$UA" -H "Origin: https://willy110611-collab.github.io" --max-time 60 -D probe/$1.h -o probe/$1.body -w '%{http_code} %{size_download} %{time_total}' "$2" || echo "fail")
            echo "$1 $code $2" >> probe/summary.txt
            head -c 5000 probe/$1.body > probe/$1.txt; rm -f probe/$1.body
          }
          # data.gov.tw 資料集描述（含下載網址）
          for id in 45501 36695 32733 143020 36602 152910 32563 62881 152911 25677 156471 58694 133170 95124; do
            probe dgt-$id "https://data.gov.tw/api/v2/rest/dataset/$id"
          done
          probe wra-swagger "https://opendata.wra.gov.tw/openapi/swagger/v1/swagger.json"
          probe wra-swagger-ui "https://opendata.wra.gov.tw/openapi/swagger/index.html"
          probe fhy-reservoir "https://fhy.wra.gov.tw/fhy/Monitor/Reservoir"
          probe taiwater-home "https://www.water.gov.tw/"
          probe taiwater-off "https://web.water.gov.tw/wateroffmap/map"
          probe twd-off "https://www.water.gov.taipei/News_Content.aspx?n=2B3A30F2E3E1D6D7"
          # 各資料集的第一個下載網址（若 API 有給）
          for f in probe/dgt-*.txt; do
            u=$(python3 -c "import json,sys;d=json.load(open('$f'));r=(d.get('result') or {}).get('distribution') or [];print(r[0].get('resourceDownloadUrl','') if r else '')" 2>/dev/null)
            n=$(basename $f .txt)
            [ -n "$u" ] && probe res-${n#dgt-} "$u"
          done
          # OSM 台灣水務設施數量
          Q='[out:json][timeout:120][bbox:21.8,118.1,26.4,122.1];(nwr["man_made"="water_works"];nwr["man_made"="water_tower"];nwr["man_made"="pipeline"]["substance"="water"];nwr["landuse"="reservoir"];nwr["water"="reservoir"];);out tags center 2000;'
          curl -sS --max-time 150 -A "$UA" -X POST --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter -o /tmp/o.json || true
          python3 - <<'PY' >> probe/summary.txt
          import json,collections
          try:
            d=json.load(open('/tmp/o.json')); c=collections.Counter()
            for e in d['elements']:
              t=e.get('tags',{}); k=t.get('man_made') or t.get('water') or t.get('landuse'); c[(e['type'],k)]+=1
            print('osm', dict(c))
            names=[e['tags'].get('name') for e in d['elements'] if e.get('tags',{}).get('man_made')=='water_works' and e['tags'].get('name')]
            print('osm water_works named', len(names), names[:15])
          except Exception as ex: print('osm fail', ex)
          PY
          cat probe/summary.txt
      - name: 提交回分支
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add probe && git commit -m "暫時：水務開放資料實測樣本（評估用）" && git push
