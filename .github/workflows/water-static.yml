# 水模式靜態資料：臺北管線、淨水場、水庫基本資料（手動或推到 claude/** 分支觸發，產生 public/water/ 後提交回分支）
name: Water static data
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/water/build-static.py', '.github/workflows/water-static.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 產生資料
        run: python3 scripts/water/build-static.py plants reservoirs taipei
      - name: 統計
        run: du -sh public/water; ls public/water | head; ls public/water/taipei | wc -l; du -sh public/water/taipei-trunk.json
      - name: 提交回分支
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add public/water && git commit -m "水模式靜態資料（臺北管線、淨水場、水庫）" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"
