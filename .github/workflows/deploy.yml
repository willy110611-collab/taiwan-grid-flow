# 台灣光脈動 — GitHub Pages 自動部署
# 1. 每次 push（一鍵更新.bat）→ 重新建置並上線
# 2. 每 10 分鐘自動抓一次台電資料 → 放到 ./data/（同網域，手機版不受 CORS 限制）
# 3. 部署失敗（Pages 暫時錯誤）時等 30 秒自動重試一次
# 4. 上線前檢查：英文翻譯缺漏、無頭瀏覽器冒煙測試（推送、或排程時發現線上還不是這個版本時才跑）；沒過就不部署
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 檢查英文翻譯
        run: npm run check --if-present   # 舊版本（回到上一版時）沒有這個檢查就略過

      - name: 抓取台電「今日電力資訊」公開資料
        continue-on-error: true
        run: |
          mkdir -p public/data
          # 先走 Cloudflare 中繼站（GitHub 的海外主機直連台電會被擋），失敗再直連台電
          RELAY="https://taiwan-grid-flow-data.willy110611.workers.dev"
          BASE="https://www.taipower.com.tw/d006/loadGraph/loadGraph/data"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          REF="https://www.taipower.com.tw/d006/loadGraph/loadGraph/genshx_.html"
          for f in genary.json genloadareaperc.csv loadpara.json loadfueltype.csv loadareas.csv loadfueltype_1.csv; do
            if curl -fsSL --max-time 25 "$RELAY/$f" -o "public/data/$f" || curl -fsSL --max-time 25 -A "$UA" -e "$REF" "$BASE/$f" -o "public/data/$f"; then
              echo "✓ $f ($(wc -c < public/data/$f) bytes)"
            else
              echo "✗ $f 取得失敗"; rm -f "public/data/$f"
            fi
          done
          # 未來供需預測：台電原檔是 Big5，只走中繼站（已轉成 UTF-8）
          if curl -fsSL --max-time 25 "$RELAY/forecast.csv" -o public/data/forecast.csv; then
            echo "✓ forecast.csv ($(wc -c < public/data/forecast.csv) bytes)"
          else
            echo "✗ forecast.csv 取得失敗"; rm -f public/data/forecast.csv
          fi
          # genary 必須是有效 JSON，否則刪掉（網頁會改用模擬資料）
          node -e "const j=JSON.parse(require('fs').readFileSync('public/data/genary.json','utf8').replace(/^\uFEFF/,''));if(!Array.isArray(j.aaData)||j.aaData.length<5)process.exit(1)" \
            || { echo "genary 無效"; rm -f public/data/genary.json; }

      - run: npm run build
      - name: 檢查電廠對應（用剛抓到的台電資料：機組名稱不能同時對到兩座電廠）
        if: hashFiles('scripts/check-geo.mjs') != ''
        run: node scripts/check-geo.mjs
      # 推送觸發的部署可能被緊接著的排程部署取消（concurrency），所以排程時也要檢查：
      # 線上的主程式檔名（內容雜湊）和這次建出來的不同 → 程式有改、還沒經過冒煙測試，照樣要跑
      - name: 判斷要不要跑冒煙測試
        id: need
        run: |
          ENTRY='const f=s=>{try{return JSON.parse(s).entry||""}catch{return ""}};'
          CUR=$(node -e "$ENTRY console.log(f(require('fs').readFileSync('dist/version.json','utf8')))" 2>/dev/null || echo "")
          LIVE=$(curl -fsSL --max-time 15 "https://willy110611-collab.github.io/taiwan-grid-flow/version.json" | node -e "$ENTRY let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(f(s)))" || echo "")
          if [ "${{ github.event_name }}" != "schedule" ] || [ -z "$CUR" ] || [ "$LIVE" != "$CUR" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "run=0" >> "$GITHUB_OUTPUT"; fi
          echo "線上 $LIVE，這次 $CUR"
      - name: 冒煙測試（新版本時）
        if: steps.need.outputs.run == '1'
        run: |
          if [ -f scripts/smoke.mjs ]; then
            npx playwright install --with-deps chromium
            npm run smoke
          else
            echo "這個版本沒有冒煙測試，略過"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: 部署失敗，等 30 秒後重試
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
